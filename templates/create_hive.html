{% extends "layout.html" %}

{% block content %}

    <h1>Neuen Sammelkauf anlegen</h1>

    <p class="helper-text">
        Hier kann ein Creator einen neuen Hive anlegen, dem Käufer später beitreten können.
    </p>

    <form action="/creator/hives/new" method="POST" class="create-hive-form">
        <div class="form-row">
            <label for="title">Produktname:</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="form-row">
            <label for="game_system">Spielsystem:</label>
            <select id="game_system" name="game_system" required>
                <option value="D&D">D&D</option>
                <option value="Pathfinder">Pathfinder</option>
                <option value="Warhammer">Warhammer</option>
                <option value="Systemunabhängig">Systemunabhängig</option>
            </select>
        </div>

        <div class="form-row">
            <label for="short_description">Kurzbeschreibung:</label>
            <input type="text" id="short_description" name="short_description" required>
        </div>

        <div class="form-row">
            <label for="description">Beschreibung:</label>
            <textarea id="description" name="description" rows="5" required></textarea>
        </div>

        <div class="form-row">
            <label for="min_participants">Mindestanzahl:</label>
            <input
                type="number"
                id="min_participants"
                name="min_participants"
                min="1"
                required
            >
        </div>

        <div class="form-row">
            <label for="deadline">Frist:</label>
            <input type="date" id="deadline" name="deadline" required>
        </div>

        <div class="form-actions">
            <button type="submit">Hive erstellen</button>
            <a class="button-link" href="/hives">Zurück zur Übersicht</a>
        </div>
    </form>

{% endblock %}
