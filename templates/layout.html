<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>DealHive</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
        }

        .page-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 230px;
            min-width: 230px;
            padding: 22px;
            border-right: 1px solid #ddd;
            background-color: #ffffff;
            box-sizing: border-box;
        }

        .sidebar-logo {
            width: 165px;
            max-width: 100%;
            height: auto;
            display: block;
            margin-bottom: 24px;
        }

        .sidebar-nav {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        .sidebar-nav li {
            margin-bottom: 10px;
        }

        .sidebar-link {
            display: block;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-decoration: none;
            color: #222;
            background-color: #fafafa;
        }

        .sidebar-link:hover {
            background-color: #eeeeee;
        }

        .sidebar-info {
            margin: 14px 0;
            padding: 10px 12px;
            border-radius: 8px;
            background-color: #f1f1f1;
            font-size: 14px;
        }

        .content-area {
            padding: 30px;
            max-width: 950px;
            width: 100%;
            box-sizing: border-box;
            background-color: #ffffff;
            min-height: 100vh;
        }

        .form-row {
            display: grid;
            grid-template-columns: 130px 240px;
            align-items: center;
            margin-bottom: 14px;
        }

        .form-row input,
        .form-row select {
            width: 240px;
            box-sizing: border-box;
        }

        .form-row textarea {
            width: 420px;
            box-sizing: border-box;
        }

        .form-actions {
            margin-left: 130px;
            margin-top: 18px;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        {% include "partials/sidebar.html" %}

        <main class="content-area">
            {% block content %}
            {% endblock %}
        </main>
    </div>

</body>
</html>
